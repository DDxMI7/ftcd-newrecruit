name: Publish Catalogue Package

on:
  push:
    branches: [main, master]
    paths:
      - '*.gst'
      - '*.cat'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate catalogues
        run: python3 scripts/validate.py all

      - name: Generate index.bsi and ftcd.catpkg.json
        run: |
          python3 scripts/generate-bsi.py \
            --name "Full Thrust Cross Dimensions" \
            --description "BattleScribe/New Recruit catalogues for Full Thrust Cross Dimensions (FTCD)" \
            --base-url "https://raw.githubusercontent.com/DDxMI7/ftcd-newrecruit/main" \
            --output index.bsi \
            *.gst *.cat
          python3 scripts/generate-catpkg.py \
            --output ftcd.catpkg.json \
            --base-url "https://raw.githubusercontent.com/DDxMI7/ftcd-newrecruit/main" \
            *.gst *.cat

      - name: Commit generated files to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.bsi ftcd.catpkg.json
          git diff --staged --quiet || git commit -m "chore: update index.bsi + ftcd.catpkg.json [skip ci]"
          git push

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest
          prerelease: true
          files: |
            index.bsi
            ftcd.catpkg.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
