name: Publish Catalogue Package

on:
  push:
    branches: [main, master]
    paths:
      - 'catalogues/**/*.gst'
      - 'catalogues/**/*.cat'
      - 'index.bsi'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history so we can push back
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate catalogues
        run: python3 scripts/validate.py all

      - name: Generate index.bsi
        run: |
          python3 scripts/generate-bsi.py \
            --name "Full Thrust Cross Dimensions" \
            --description "BattleScribe/New Recruit catalogues for Full Thrust Cross Dimensions (FTCD)" \
            --base-url "https://raw.githubusercontent.com/DDxMI7/ftcd-newrecruit/main" \
            --output index.bsi \
            catalogues/system/*.gst catalogues/factions/*.cat

      - name: Commit index.bsi to repo
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.bsi
          git diff --staged --quiet || git commit -m "chore: update index.bsi [skip ci]"
          git push

      - name: Upload .bsi to release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: index.bsi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
